# main に入ったら Cloudflare に自動デプロイする（CD）。
#   テスト → D1 マイグレーション → Worker のデプロイ → スラッシュコマンドの登録
# Actions タブ > deploy > Run workflow から手動でも実行できる。
#
# 必要な Secrets（Settings > Secrets and variables > Actions）
#   CLOUDFLARE_API_TOKEN   Workers Scripts / D1 を Edit できる API トークン
#   CLOUDFLARE_ACCOUNT_ID  `npx wrangler whoami` で出る Account ID
#   DISCORD_BOT_TOKEN      コマンド登録用（Worker 側の secret とは別に必要）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは途中で止めず、1つずつ順番に走らせる
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # コードより先にテーブルを変える（新しいコードが新しい列を読むため）
      - name: D1 マイグレーション
        run: npx wrangler d1 migrations apply discord-bot --remote
      - name: Worker をデプロイ
        run: npx wrangler deploy
      - name: スラッシュコマンドを登録
        run: npm run register
        env:
          # 公開情報なので wrangler.jsonc と同じ値をそのまま使う
          DISCORD_APPLICATION_ID: '1334491224127569940'
          DISCORD_GUILD_ID: '1211154854207160440'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
